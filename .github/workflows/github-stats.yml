name: GitHub Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate stats
        run: |
          mkdir -p assets

          curl -L \
            "https://github-readme-stats.vercel.app/api?username=Canzah-fatima&show_icons=true&theme=tokyonight" \
            -o assets/github-stats.svg

          curl -L \
            "https://github-readme-stats.vercel.app/api/top-langs/?username=Canzah-fatima&layout=compact&theme=tokyonight" \
            -o assets/top-languages.svg

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub stats"
            git push
          fi
